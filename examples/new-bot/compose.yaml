services:
  bot:
    # Pin a release tag or commit SHA; do not silently upgrade production.
    image: "${BOT_MACHINE_IMAGE:-ghcr.io/xamelon/bot_machine_procs:sha-f027eae64491d9fe4513eff0d2c99eaef76ca47a}"
    init: true
    restart: unless-stopped
    read_only: true
    working_dir: /app
    env_file: .env
    environment:
      APP_ROOT: /app
      PORT: "4100"
      SUPERVISOR_HOST: 0.0.0.0
      TMPDIR: /tmp
      BUN_INSTALL_CACHE_DIR: /tmp/bun-cache
      # Development defaults. Production: WATCH=0; enable agent REPL deliberately.
      WATCH: "${WATCH:-1}"
      AGENT_REPL: "${AGENT_REPL:-0}"
    command: ["sh", "-c", "bun install --frozen-lockfile && exec bun /bot_machine/supervisor/start.ts"]
    ports:
      - "127.0.0.1:${BOT_PORT:-4100}:4100"
    volumes:
      - .:/app
      - bot_node_modules:/app/node_modules
    tmpfs:
      - /tmp

volumes:
  bot_node_modules:
