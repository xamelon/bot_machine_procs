<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bot recovery</title><link rel="stylesheet" href="/_control/agent.css"><script src="/_control/agent.js" defer></script><style>body{margin:0;background:#fafafa;color:#242424;font:14px system-ui}.bot-workbench{grid-template-columns:minmax(0,1fr) minmax(320px,480px)}main{padding:32px}button{cursor:pointer}pre{white-space:pre-wrap}</style></head><body><div class="bot-workbench"><main><h1>Recovery</h1><p>This page does not load application code.</p><a href="/bot/channels">Return to admin</a><pre id="process-status" role="status"></pre><button id="restart" type="button">Restart runtime</button></main><aside class="agent-panel" aria-label="Coding agent"><header><strong>Pi</strong><span data-agent-status role="status">Connecting…</span></header><div class="agent-messages" data-agent-messages></div><p data-agent-error role="alert" hidden></p><form data-agent-form><label for="prompt">Repair the application</label><textarea id="prompt" name="text" rows="3" required></textarea><div><button type="submit">Send</button><button type="button" data-agent-stop>Stop</button></div></form></aside></div><script>async function refresh(){try{const res=await fetch('/_control/status');document.getElementById('process-status').textContent=JSON.stringify(await res.json(),null,2)}catch(e){document.getElementById('process-status').textContent=e.message}}document.getElementById('restart').onclick=async()=>{await fetch('/_control/restart',{method:'POST'});await refresh()};refresh();setInterval(refresh,2000)</script></body></html>
